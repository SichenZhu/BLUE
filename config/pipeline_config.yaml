# Deconvolution-pipeline configuration. All paths are interpreted relative to
# the repo root unless absolute. Edit values to fit your dataset, then run the
# pipeline scripts under scripts/deconv/ in numerical order.

paths:
  # Step 1 inputs ---------------------------------------------------------
  sc_h5ad_dir:           dataset/your_project/single-cell/   # directory of per-patient .h5ad files
  sc_h5ad_glob:          "*.h5ad"                            # glob pattern, evaluated under sc_h5ad_dir
  bulk_tsv:              dataset/your_project/bulk_quant.tsv # genes × samples, first col = gene_id
  bulk_metadata_tsv:     dataset/your_project/bulk_metadata.tsv  # optional, joined into prediction CSV; leave null if absent

  # Step 1 output / downstream input -------------------------------------
  combined_sc_h5ad:      outputs/combined_labeled.h5ad
  celltype_mapping_yaml: config/celltype_mapping.yaml         # cell types to be deconvolved into

  # Steps 2–5 working directories ----------------------------------------
  gene_lists_dir:        outputs/deconv_training/             # output folder, holds all_common_gene_lst.txt, all_DEG_lst.txt
  pseudobulk_dir:        outputs/deconv_training/pseudobulks/ # output folder, holds *_trainbulk.h5ad / *_valbulk.h5ad / all_*.h5ad
  ckpt_root:             outputs/deconv_ckpt/                 # output folder, one subdir per run (timestamped)
  predictions_dir:       outputs/deconv_predictions/          # output folder, holds predicted_proportions_epN.csv, predicted_ctGEP_epN.h5ad

  # Optional: gene lists for the model input (bulk features) and output
  # (per-cell-type GEP). Both default to <gene_lists_dir>/all_DEG_lst.txt when
  # null. Set to point at a different one-gene-per-line text file to use a
  # custom panel. Leaving output_gene_list null reuses the input list.
  input_gene_list:       null
  output_gene_list:      null

# How to read the per-patient sc h5ads.
sc_schema:
  fine_celltype_col:    cell_type        # obs column carrying the existing cell type label
  library_id_col:       library_id       # obs column that uniquely identifies each patient/library
  raw_counts_layer:     null             # null = use .X; else name the layer that has raw counts
  ensembl_var_names:    true             # true if var_names are Ensembl gene IDs matching the bulk TSV

# Pseudobulk generation (Dirichlet-mixed, uniform + α=50/15/5 dominant variants).
pseudobulk:
  samplenum_per_ct:        30          # per-patient train sample to be created: total sample num = samplenum_per_ct * num_ct
  val_samplenum_per_patient: 10
  samplenum_all_train:     3000        # total training sample to be created by pooling all cells from all patients
  samplenum_all_val:       300         # total validation sample to be created by pooling all cells from all patients
  n_cells:                 500         # number of cells within each pseudobulk
  train_ratio:             0.8         # train/val cell-level split inside each patient
  val_ratio:               0.1
  seed:                    42
  # Dirichlet α controlling the mixture of cell-type proportions:
  #  - uniform_alpha: α used for every cell type in the "balanced" block.
  #  - dominant_alphas: list of α values; each produces a dominant block where
  #    one cell type gets that α (rest stay at 1), repeated across all cell
  #    types. Higher α = more concentrated (more dominant) proportions.
  uniform_alpha:           1
  dominant_alphas:         [50, 15, 5]

# Per-patient one-vs-rest DEG selection.
degs:
  fdr_rate:        0.1
  num_deg_per_ct:  200                 # max positive-logFC DEGs picked per cell type (greedy, dedup) then unioned across cell types and all sc patients

# UNet training hyperparameters. CLI flags on 04_train_unet.py override most of these.
training:
  batch_size:         64
  epochs:             50
  lr:                 1.0e-5
  weight_decay:       0
  coeff_ct_gep:       1
  coeff_prop:         100
  sched_step:         20
  sched_gamma:        0.5
  use_amp:            true
  seed:               42
  cuda:               0                # GPU id
  preprocess_mode:    deg_first        # 'deg_first' (norm over DEGs only) | 'all_first' (norm over full transcriptome, then subset)
  split_mode:         pseudo           # 'pseudo' (default; uses all_*.h5ad + per-patient) | 'held_out_patients' (define which patients to hold out for validation)
  split_seed:         42               # only used when split_mode = held_out_patients

# Prediction.
predict:
  cuda: 0
